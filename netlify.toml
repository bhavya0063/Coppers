[build]
  # The app lives in a subdirectory of the repository
  base = "friendly-website-redesign-main"
  # Install dependencies explicitly so the build works even when no install step ran beforehand
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Build the TanStack Start server for Netlify instead of the Cloudflare default
  NITRO_PRESET = "netlify"
